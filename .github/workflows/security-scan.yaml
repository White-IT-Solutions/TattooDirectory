# .github/workflows/security-scan.yaml

name: 'Security & Compliance Scan'

on:
  push:
    branches:
      - release-dev
      - release-prod
      - main
  pull_request:
    branches:
      - release-dev
      - release-prod
      - main
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  dependency-scan:
    name: 'Dependency Vulnerability Scan'
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        component:
          - name: 'Frontend'
            path: 'frontend'
            package-manager: 'npm'
          - name: 'Backend'
            path: 'backend/src'
            package-manager: 'npm'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: matrix.component.package-manager == 'npm'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.component.path }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.component.path }}
        run: npm ci

      - name: Run npm audit
        working-directory: ${{ matrix.component.path }}
        run: |
          echo "Running npm audit for ${{ matrix.component.name }}..."
          npm audit --audit-level=moderate --json > /tmp/npm-audit-${{ matrix.component.name }}.json || true
          
          # Check for high/critical vulnerabilities
          HIGH_VULNS=$(jq '.metadata.vulnerabilities.high // 0' /tmp/npm-audit-${{ matrix.component.name }}.json)
          CRITICAL_VULNS=$(jq '.metadata.vulnerabilities.critical // 0' /tmp/npm-audit-${{ matrix.component.name }}.json)
          
          echo "High vulnerabilities: $HIGH_VULNS"
          echo "Critical vulnerabilities: $CRITICAL_VULNS"
          
          if [ "$CRITICAL_VULNS" -gt 0 ]; then
            echo "❌ Critical vulnerabilities found in ${{ matrix.component.name }}"
            npm audit --audit-level=critical
            exit 1
          elif [ "$HIGH_VULNS" -gt 0 ]; then
            echo "⚠️ High vulnerabilities found in ${{ matrix.component.name }}"
            npm audit --audit-level=high
          else
            echo "✅ No high or critical vulnerabilities found in ${{ matrix.component.name }}"
          fi

      - name: Upload audit results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: npm-audit-${{ matrix.component.name }}
          path: /tmp/npm-audit-${{ matrix.component.name }}.json
          retention-days: 30

  sast-scan:
    name: 'Static Application Security Testing'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten
            p/javascript
            p/typescript
            p/python
          generateSarif: "1"

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: semgrep.sarif

  secrets-scan:
    name: 'Secrets Detection'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --debug --only-verified

  infrastructure-scan:
    name: 'Infrastructure Security Scan'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infrastructure/
          framework: terraform
          output_format: sarif
          output_file_path: checkov-results.sarif
          soft_fail: true

      - name: Upload Checkov results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: checkov-results.sarif

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: infrastructure/
          format: sarif
          sarif_file: tfsec-results.sarif
          soft_fail: true

      - name: Upload tfsec results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: tfsec-results.sarif

  docker-scan:
    name: 'Container Security Scan'
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' # Skip on PRs to avoid rate limits
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker images for scanning
        run: |
          # Build any Docker images in the project for scanning
          if [ -f "backend/Dockerfile" ]; then
            docker build -t tattoo-backend:scan backend/
          fi
          
          if [ -f "frontend/Dockerfile" ]; then
            docker build -t tattoo-frontend:scan frontend/
          fi

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'tattoo-backend:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: trivy-results.sarif

  compliance-check:
    name: 'Compliance Validation'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for required security files
        run: |
          echo "Checking for required security and compliance files..."
          
          REQUIRED_FILES=(
            "SECURITY.md"
            ".github/SECURITY.md"
            "docs/SECURITY.md"
          )
          
          FOUND_SECURITY_FILE=false
          for file in "${REQUIRED_FILES[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ Found security policy: $file"
              FOUND_SECURITY_FILE=true
              break
            fi
          done
          
          if [ "$FOUND_SECURITY_FILE" = false ]; then
            echo "⚠️ No security policy file found. Consider adding SECURITY.md"
          fi
          
          # Check for other compliance files
          if [ -f "LICENSE" ] || [ -f "LICENSE.md" ] || [ -f "LICENSE.txt" ]; then
            echo "✅ License file found"
          else
            echo "⚠️ No license file found"
          fi
          
          if [ -f "README.md" ]; then
            echo "✅ README.md found"
          else
            echo "⚠️ No README.md found"
          fi

      - name: Validate Terraform security practices
        run: |
          echo "Validating Terraform security practices..."
          
          # Check for hardcoded secrets (basic patterns)
          if grep -r -i "password\s*=\s*[\"'][^\"']*[\"']" infrastructure/ --include="*.tf" --include="*.tfvars"; then
            echo "❌ Potential hardcoded passwords found in Terraform files"
            exit 1
          else
            echo "✅ No hardcoded passwords detected in Terraform files"
          fi
          
          # Check for public S3 buckets
          if grep -r "acl.*public" infrastructure/ --include="*.tf"; then
            echo "⚠️ Public S3 bucket ACLs detected - ensure this is intentional"
          else
            echo "✅ No public S3 bucket ACLs detected"
          fi
          
          # Check for encryption settings
          if grep -r "encrypt" infrastructure/ --include="*.tf" > /dev/null; then
            echo "✅ Encryption configurations found"
          else
            echo "⚠️ No encryption configurations detected"
          fi

  security-report:
    name: 'Generate Security Report'
    needs: [dependency-scan, sast-scan, secrets-scan, infrastructure-scan, compliance-check]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: security-artifacts

      - name: Generate security summary
        run: |
          echo "# Security Scan Summary" > security-report.md
          echo "" >> security-report.md
          echo "**Scan Date:** $(date -u)" >> security-report.md
          echo "**Branch:** ${{ github.ref_name }}" >> security-report.md
          echo "**Commit:** ${{ github.sha }}" >> security-report.md
          echo "" >> security-report.md
          
          echo "## Scan Results" >> security-report.md
          echo "" >> security-report.md
          
          # Check job results
          echo "- **Dependency Scan:** ${{ needs.dependency-scan.result }}" >> security-report.md
          echo "- **SAST Scan:** ${{ needs.sast-scan.result }}" >> security-report.md
          echo "- **Secrets Scan:** ${{ needs.secrets-scan.result }}" >> security-report.md
          echo "- **Infrastructure Scan:** ${{ needs.infrastructure-scan.result }}" >> security-report.md
          echo "- **Compliance Check:** ${{ needs.compliance-check.result }}" >> security-report.md
          echo "" >> security-report.md
          
          # Add recommendations
          echo "## Recommendations" >> security-report.md
          echo "" >> security-report.md
          echo "1. Review any high or critical vulnerabilities found" >> security-report.md
          echo "2. Update dependencies with known vulnerabilities" >> security-report.md
          echo "3. Address any infrastructure security issues" >> security-report.md
          echo "4. Ensure no secrets are committed to the repository" >> security-report.md
          echo "" >> security-report.md
          
          cat security-report.md

      - name: Upload security report
        uses: actions/upload-artifact@v3
        with:
          name: security-scan-report
          path: security-report.md
          retention-days: 90

      - name: Comment on PR with security results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            let comment = `## 🔒 Security Scan Results
            
            **Status:** `;
            
            const results = {
              'dependency-scan': '${{ needs.dependency-scan.result }}',
              'sast-scan': '${{ needs.sast-scan.result }}',
              'secrets-scan': '${{ needs.secrets-scan.result }}',
              'infrastructure-scan': '${{ needs.infrastructure-scan.result }}',
              'compliance-check': '${{ needs.compliance-check.result }}'
            };
            
            const failed = Object.values(results).filter(r => r === 'failure').length;
            const success = Object.values(results).filter(r => r === 'success').length;
            
            if (failed > 0) {
              comment += `❌ ${failed} scan(s) failed, ${success} passed\n\n`;
            } else {
              comment += `✅ All security scans passed\n\n`;
            }
            
            comment += `### Scan Details\n`;
            for (const [scan, result] of Object.entries(results)) {
              const emoji = result === 'success' ? '✅' : result === 'failure' ? '❌' : '⚠️';
              comment += `- ${emoji} **${scan}**: ${result}\n`;
            }
            
            comment += `\n📊 [View detailed results](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });